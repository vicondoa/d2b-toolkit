name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v31
      - name: Verify and package source distribution
        shell: bash
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          manifest_version="$(sed -n 's/^version = "\\([^"]*\\)"/\\1/p' Cargo.toml | head -n1)"
          test "$version" = "$manifest_version"
          nix flake check --print-build-logs
          nix build --print-build-logs .#d2b-client-toolkit
          mkdir -p artifacts/stage
          cp -RL result/share/d2b-client-toolkit \
            "artifacts/stage/d2b-client-toolkit-$version"
          tar -C artifacts/stage -czf \
            "artifacts/d2b-client-toolkit-$version.tar.gz" \
            "d2b-client-toolkit-$version"
          (
            cd artifacts
            sha256sum "d2b-client-toolkit-$version.tar.gz" > SHA256SUMS
          )
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            "artifacts/d2b-client-toolkit-${GITHUB_REF_NAME#v}.tar.gz" \
            artifacts/SHA256SUMS \
            --generate-notes \
            --title "d2b-client-toolkit ${GITHUB_REF_NAME#v}"
